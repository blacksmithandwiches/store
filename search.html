*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}

.bw-card{border:1px solid var(--border);border-radius:var(--radius);padding:18px;background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;gap:14px}

.bw-footer{border-top:1px solid var(--border);padding:24px 0;font-size:13px;color:var(--muted)}

  var CAT_LABEL = { books: 'Books & Zines', music: 'Music & Audio', games: 'Games', apps: 'Apps & Tools', video: 'Video' };

  var form = document.getElementById('bwSearchForm');
  var input = document.getElementById('bwSearchInput');
  var clearBtn = document.getElementById('bwClearBtn');
  var statusText = document.getElementById('bwStatusText');
  var grid = document.getElementById('bwResultsGrid');

  function normalize(str) {
    return (str || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
  }
  function escapeHtml(str) {
    return (str || '').toString().replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function syncUrl(query) {
    var url = new URL(window.location.href);
    if (query) { url.searchParams.set('q', query); } else { url.searchParams.delete('q'); }
    window.history.replaceState({}, '', url.toString());
  }
  function haystack(item) {
    return normalize([item.title, item.creator, item.category, CAT_LABEL[item.category] || '', item.description, item.excerpt, (item.formats || []).join(' ')].join(' '));
  }
  function renderResults() {
    var rawQuery = input.value;
    var tokens = normalize(rawQuery).split(' ').filter(Boolean);
    clearBtn.style.display = rawQuery.trim() ? 'inline-block' : 'none';
    syncUrl(rawQuery.trim());
    var matches = !tokens.length ? CATALOGUE : CATALOGUE.filter(function (item) {
      var hay = haystack(item);
      return tokens.every(function (t) { return hay.indexOf(t) > -1; });
    });
    if (!tokens.length) {
      statusText.innerHTML = 'Showing all <strong>' + matches.length + '</strong> releases';
    } else {
      statusText.innerHTML = 'Found <strong>' + matches.length + '</strong> result' + (matches.length === 1 ? '' : 's') + ' for &ldquo;<strong>' + escapeHtml(rawQuery.trim()) + '</strong>&rdquo;';
    }
    if (!matches.length) {
      grid.innerHTML = '<div class="bw-empty" style="grid-column:1/-1;"><h2>No matching editions for &ldquo;' + escapeHtml(rawQuery.trim()) + '&rdquo;</h2><p>Try a partial title or author: <strong>Teraura</strong>, <strong>Chekhov</strong>, <strong>Meditations</strong>, <strong>Tao</strong>.</p><button type="button" id="bwResetEmpty" class="bw-btn bw-btn-blue">Show All Releases</button></div>';
      document.getElementById('bwResetEmpty').onclick = function () { input.value = ''; renderResults(); input.focus(); };
      return;
    }
    grid.innerHTML = matches.map(function (item) {
      var isFree = Number(item.price) === 0;
      var price = isFree ? 'Free' : '$' + Number(item.price).toFixed(2);
      var action = item.category === 'video' ? 'Watch' : (isFree ? 'Get' : 'Buy');
      var cover = item.cover ? '<img class="bw-cover" src="' + escapeHtml(item.cover) + '" alt="" loading="lazy" />' : '';
      var formats = (item.formats && item.formats.length) ? '<p class="bw-formats">' + escapeHtml(item.formats.join(' • ')) + '</p>' : '';
      return '<article class="bw-card"><div>' +
        '<div class="bw-card-top"><span class="bw-pill">' + escapeHtml(item.badge || CAT_LABEL[item.category] || 'Release') + '</span><span class="bw-price">' + price + '</span></div>' +
        cover +
        '<h2>' + escapeHtml(item.title) + '</h2>' +
        '<p class="bw-author">By ' + escapeHtml(item.creator) + '</p>' +
        '<p class="bw-desc">' + escapeHtml(item.excerpt || item.description || '') + '</p>' + formats +
        '</div><div class="bw-card-actions">' +
        (item.url ? '<a href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener" class="bw-btn-blue">' + action + '</a>' : '') +
        '<a href="/#product-' + item.id + '" class="bw-btn-yellow">View in Store</a>' +
        '</div></article>';
    }).join('');
  }
  async function loadLiveCatalogue() {
    try {
      var res = await fetch(SUPABASE_URL + '/rest/v1/products?select=id,title,creator,category,price,formats,excerpt,description,cover_url,download_url,badge,status&status=eq.approved&order=id.asc', {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY }
      });
      if (!res.ok) return;
      var rows = await res.json();
      if (Array.isArray(rows) && rows.length) {
        CATALOGUE = rows.map(function (r) {
          return { id: r.id, title: r.title || '', creator: r.creator || '', category: r.category || '', price: Number(r.price) || 0,
            formats: Array.isArray(r.formats) ? r.formats : [], excerpt: (r.excerpt || '').slice(0, 220), description: (r.description || '').slice(0, 400),
            cover: r.cover_url || '', url: r.download_url || '', badge: r.badge || '' };
        });
        renderResults();
      }
    } catch (e) { /* embedded snapshot stays */ }
  }
  form.addEventListener('submit', function (e) { e.preventDefault(); renderResults(); });
  input.addEventListener('input', renderResults);
  clearBtn.addEventListener('click', function () { input.value = ''; renderResults(); input.focus(); });
  document.querySelectorAll('.bw-chip').forEach(function (chip) {
    chip.addEventListener('click', function () { input.value = chip.getAttribute('data-q') || ''; renderResults(); input.focus(); });
  });
  var initialQ = new URLSearchParams(window.location.search).get('q') || '';
  if (initialQ) { input.value = initialQ; }
  renderResults();
  loadLiveCatalogue();
})();
</script>
</body>
</html>
