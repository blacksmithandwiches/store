            function setOpen(o) { n.classList.toggle('bw-open', o); shade.classList.toggle('bw-on', o); b.setAttribute('aria-expanded', o ? 'true' : 'false'); }
            b.addEventListener('click', function () { setOpen(!n.classList.contains('bw-open')); });
            shade.addEventListener('click', function () { setOpen(false); });
            n.addEventListener('click', function (e) { if (e.target && e.target.closest && e.target.closest('a')) setOpen(false); });
        })();
    </script>
</body>
</html>
