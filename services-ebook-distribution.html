                "not2": "Налоговые формы роялти — они остаются между вами и каждой платформой",
                "svcTotalWord": "итого"
        }
};
        let curLang = 'en';
        try { const s = localStorage.getItem('bw_lang'); if (s && I18N[s]) curLang = s; } catch (e) { /* ignore */ }
        function t(k) { return (I18N[curLang] && I18N[curLang][k]) || I18N.en[k] || k; }
        function applyLang(lang) {
            curLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => { const v = t(el.getAttribute('data-i18n')); if (v) el.innerHTML = v; });
            document.querySelectorAll('[data-lang-btn]').forEach(b => {
                const on = b.getAttribute('data-lang-btn') === lang;
                b.classList.toggle('bg-brandYellow', on);
                b.classList.toggle('text-brandDarkBlue', on);
            });
        }
        function setLang(lang) { try { localStorage.setItem('bw_lang', lang); } catch (e) { /* ignore */ } applyLang(lang); }
        document.addEventListener('DOMContentLoaded', () => { applyLang(curLang); if (window.lucide) lucide.createIcons(); });
        (function () {
            var b = document.getElementById('bwMenuBtn'), n = document.getElementById('bwTopNav');
            if (!b || !n) return;
            var shade = document.createElement('div');
            shade.id = 'bwNavShade';
            document.body.appendChild(shade);
            function setOpen(o) { n.classList.toggle('bw-open', o); shade.classList.toggle('bw-on', o); b.setAttribute('aria-expanded', o ? 'true' : 'false'); }
            b.addEventListener('click', function () { setOpen(!n.classList.contains('bw-open')); });
            shade.addEventListener('click', function () { setOpen(false); });
            n.addEventListener('click', function (e) { if (e.target && e.target.closest && e.target.closest('a')) setOpen(false); });
        })();
    </script>
